name: Supabase keep-alive

# Free-tier Supabase pauses projects after ~7 days without API traffic,
# which takes the Human Benchmark leaderboards offline. Ping the scores
# table twice a week so the project never idles out.

on:
  schedule:
    # Mondays and Thursdays at 03:17 UTC (off-peak, avoids the :00 rush)
    - cron: "17 3 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://vjmmegregguphbbbevzd.supabase.co/rest/v1/scores?select=game_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $code"
          # Fail the job on anything but 200 so a paused/broken project
          # produces a red run + notification email instead of silence.
          [ "$code" = "200" ]
