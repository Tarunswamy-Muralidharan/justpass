# Maestro flow: upload one PDF as a CA1 paper via the QPapers feature.
# Run once per subject by passing PDF_FILENAME + SUBJECT_INDEX env vars.
#
# Pre-reqs:
#   - User signed in, app on Dashboard
#   - PDF already pushed to /sdcard/Download/${PDF_FILENAME}
#
# Usage (one PDF at a time):
#   maestro --device 192.168.0.4:5555 test qpapers_upload_test.yaml \
#     -e PDF_FILENAME=23EE203_ProgrammingInC_CA1_2026.pdf \
#     -e SUBJECT_INDEX=0

appId: com.justpass.app
---
# 0. Dashboard — tap "Prev Year Papers" tile
- assertVisible: "Prev Year Papers"
- tapOn: "Prev Year Papers"

# 1. Department picker — tap user's department highlighted as "YOURS"
- assertVisible: "Previous Year Papers"
- tapOn:
    text: "YOURS"

# 2. Semester picker — pick the first available
- assertVisible:
    text: "Semester 1"
- tapOn:
    text: "Semester 1"

# 3. Subject list — tap the first subject card (whichever it is)
# Maestro tip: the subject code text starts with "23" or "25" — match the first
- tapOn:
    text: ".*"
    index: 0

# 4. Category screen — CA1 tab is selected by default
- assertVisible: "CA1"

# 5. Empty state — tap "Contribute a CA1 paper"
- tapOn:
    text: "Contribute"

# 6. Pick year — dropdown shows 2030..2022, choose 2026
- tapOn: "Year 2026"

# 7. Upload screen — tap "Pick PDF"
- assertVisible: "Anonymous to everyone except admin"
- tapOn: "Pick PDF"

# 8. System file picker
# This is the most fragile part — the system picker varies by Android version.
# Open the Downloads section and pick the test PDF.
- tapOn:
    text: "Downloads"
    optional: true
- tapOn:
    text: ${PDF_FILENAME}

# 9. Anonymity confirmation dialog
- assertVisible: "Submit anonymously?"
- tapOn: "Submit"

# 10. Wait for upload + thank-you screen
- extendedWaitUntil:
    visible: "Thanks!"
    timeout: 60000
- assertVisible: "Paper submitted!"

# Done — back out to dashboard for the next iteration
- tapOn:
    text: "I'm done"
    optional: true
- tapOn:
    text: "Back to papers"
    optional: true
